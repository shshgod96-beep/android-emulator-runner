name: Run Android Emulator with UI
on: 
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM (تسريع الهاردوير)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Desktop & VNC (تثبيت واجهة وشاشة وهمية)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xvfb x11vnc dbus-x11

      - name: Setup Tailscale (تجهيز الاتصال الآمن)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Download rootAVD and LSPosed (تحميل أدوات الروت)
        run: |
          # تحميل rootAVD لتثبيت Magisk
          git clone https://github.com/newbit1/rootAVD.git
          
          # تحميل LSPosed (أحدث إصدار Zygisk)
          LSPOSED_URL=$(curl -s https://api.github.com/repos/LSPosed/LSPosed/releases/latest | grep -oP 'https://[^"]*LSPosed-v[^"]*-zygisk-release\.zip' | head -1)
          if [ -n "$LSPOSED_URL" ]; then
            wget -q "$LSPOSED_URL" -O LSPosed.zip
          else
            wget -q "https://github.com/LSPosed/LSPosed/releases/download/v1.9.2/LSPosed-v1.9.2-7024-zygisk-release.zip" -O LSPosed.zip
          fi
          
          # إنشاء سكربت يعمل تلقائياً قبل تشغيل المحاكي لتفليش Magisk
          cat > $GITHUB_WORKSPACE/patch-ramdisk.sh << 'EOF'
          #!/bin/bash
          echo "⏳ جاري تثبيت Magisk عبر rootAVD..."
          cd $GITHUB_WORKSPACE/rootAVD
          ./rootAVD.sh $ANDROID_SDK_ROOT/system-images/android-29/default/x86_64/ramdisk.img
          echo "✅ تم تفليش Magisk بنجاح!"
          EOF
          chmod +x $GITHUB_WORKSPACE/patch-ramdisk.sh

      - name: Start Screen and VNC Server
        run: |
          # إنشاء شاشة وهمية
          Xvfb :0 -screen 0 1920x1080x24 &
          sleep 2
          
          # تشغيل واجهة سطح المكتب
          DISPLAY=:0 xfce4-session &
          
          # تشغيل بث الشاشة (VNC) بدون باسورد لتسهيل الدخول
          x11vnc -display :0 -nopw -xkb -ncache 10 -ncache_cr -forever &
          
          echo "=========================================================="
          echo "✅ الاتصال جاهز عبر Tailscale!"
          echo "افتح تطبيق Tailscale في جهازك، وانسخ الـ IP الخاص بجهاز (github-actions-...)"
          echo "ثم افتحه في برنامج VNC Viewer."
          echo "=========================================================="

      - name: Start Android Emulator with Root
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: :0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: ${{ github.workspace }}/patch-ramdisk.sh
          script: |
            echo "⏳ جاري تجهيز Magisk و LSPosed..."
            
            # انتظار اكتمال تشغيل المحاكي
            adb wait-for-device
            sleep 15
            
            # التأكد من أن Magisk يعمل
            echo "🔍 فحص حالة Magisk..."
            adb shell "su -c 'magisk -v'" && echo "✅ Magisk يعمل!" || echo "⚠️ Magisk قد يحتاج إعادة تشغيل"
            
            # تفعيل Zygisk (مطلوب لـ LSPosed)
            adb shell "su -c 'magisk --sqlite \"REPLACE INTO settings (key,value) VALUES(\\\"zygisk\\\",1);\"'"
            
            # تثبيت LSPosed كموديول Magisk
            if [ -f "$GITHUB_WORKSPACE/LSPosed.zip" ]; then
              adb push $GITHUB_WORKSPACE/LSPosed.zip /sdcard/LSPosed.zip
              adb shell "su -c 'magisk --install-module /sdcard/LSPosed.zip'"
              echo "✅ تم تثبيت LSPosed! جاري إعادة التشغيل..."
              adb reboot
              sleep 30
              adb wait-for-device
              sleep 20
            fi
            
            echo "=========================================================="
            echo "✅ المحاكي جاهز مع Root + LSPosed!"
            echo "يمكنك الدخول عبر VNC وتجربة تطبيقك الآن"
            echo "=========================================================="
            sleep 3600
