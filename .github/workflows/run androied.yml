name: Run Android Emulator with UI
on: 
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM (تسريع الهاردوير)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Desktop & VNC (تثبيت واجهة وشاشة وهمية)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xvfb x11vnc dbus-x11

      - name: Setup Tailscale (تجهيز الاتصال الآمن)
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install System Image and Patch with Magisk (تثبيت وتفليش Magisk)
        run: |
          # تثبيت صورة النظام أولاً
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-29;google_apis;x86_64"
          




      - name: Start Screen and VNC Server
        run: |
          Xvfb :0 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:0 xfce4-session &
          x11vnc -display :0 -nopw -xkb -ncache 10 -ncache_cr -forever &
          
          TS_IP=$(tailscale ip -4)
          echo "=========================================================="
          echo "✅ الاتصال جاهز عبر Tailscale!"
          echo "انسخ هذا الـ IP وضعه في برنامج VNC Viewer للاتصال:"
          echo "👉  $TS_IP  👈"
          echo "=========================================================="

      - name: Create Emulator Script
        run: |
          cat > $GITHUB_WORKSPACE/run_emulator.sh << 'EOF'
          #!/bin/bash
          echo "⏳ جاري تجهيز المحاكي..."
          
          # 1# تحميل rootAVD
          git clone https://github.com/newbit1/rootAVD.git
          
          # 2# الدخول لمجلد rootAVD
          cd ~/work/android-emulator-runner/android-emulator-runner/rootAVD
          
          # 3# تعريف مسار Android SDK
          export ANDROID_HOME=/usr/local/lib/android/sdk
          
          # 4# تفليش Magisk في صورة النظام (المحاكي هيقفل تلقائياً بعدها)
          echo "⏳ جاري تفليش Magisk..."
          ./rootAVD.sh system-images/android-29/google_apis/x86_64/ramdisk.img
          echo "✅ تم تفليش Magisk! جاري إعادة تشغيل المحاكي..."
          
          # 5# إعادة تشغيل المحاكي بـ Cold Boot عشان الروت يشتغل
          DISPLAY=:0 /usr/local/lib/android/sdk/emulator/emulator -avd test -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          
          # استنى المحاكي يفتح بالكامل
          echo "⏳ جاري انتظار المحاكي..."
          /usr/local/lib/android/sdk/platform-tools/adb wait-for-device
          sleep 30
          
          # 6# تشغيل adb كروت
          /usr/local/lib/android/sdk/platform-tools/adb root
          
          # 7# استنى شوية عشان adb يرجع
          sleep 3
          
          # 8# تفعيل منح صلاحيات الروت تلقائياً لكل التطبيقات
          /usr/local/lib/android/sdk/platform-tools/adb shell "magisk --sqlite \"REPLACE INTO settings (key, value) VALUES ('su_auto_response', 2);\""
          
          # 9# إعادة تشغيل تطبيق Magisk لتطبيق الإعدادات
          /usr/local/lib/android/sdk/platform-tools/adb shell am force-stop com.topjohnwu.magisk
          
          echo "=========================================================="
          echo "✅ المحاكي جاهز مع Root! يمكنك الدخول عبر VNC"
          echo "=========================================================="
          sleep 21600
          EOF
          chmod +x $GITHUB_WORKSPACE/run_emulator.sh

      - name: Start Android Emulator with Root
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: :0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash $GITHUB_WORKSPACE/run_emulator.sh

